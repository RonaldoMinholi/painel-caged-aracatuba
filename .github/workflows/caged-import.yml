name: Importar Novo CAGED

on:
  schedule:
    - cron: '20 10 * * *'

  workflow_dispatch:
    inputs:
      competencia:
        description: 'AAAAMM. Vazio = importa o arquivo mais recente da pasta no Google Drive.'
        required: false
      importar_tabela_oficial:
        description: 'Importar a Tabela 8.1 oficial (histórico com ajustes).'
        type: boolean
        required: false
        default: false

jobs:
  import:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r importer/requirements.txt

      - name: Importar Tabela 8.1 oficial
        if: ${{ inputs.importar_tabela_oficial == true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TABLES_FOLDER_URL: https://drive.google.com/drive/folders/1SLFCZ184KseNP8W9Xc6YMe6rCrHeuaiU?usp=drive_link
          SOURCE_PAGE_URL: https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/acoes-e-programas/programas-projetos-acoes-obras-e-atividades/estatisticas-trabalho/novo-caged/2026/julho/pagina-inicial
        run: |
          mkdir -p official-tables
          gdown --folder "$TABLES_FOLDER_URL" --output official-tables --remaining-ok

          workbook=$(find official-tables -type f -iname '*.xlsx' | head -n 1)
          test -n "$workbook"

          python importer/import_official_tables.py \
            --file "$workbook" \
            --source-url "$SOURCE_PAGE_URL"

      - name: Importar microdados da competência
        if: ${{ inputs.importar_tabela_oficial != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPETENCIA: ${{ inputs.competencia }}
          CAGED_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1oHTXiVbjUogyKwxA1hxZXjGd83-c-8oO
        run: |
          mkdir -p microdados
          gdown --folder "$CAGED_DRIVE_FOLDER_URL" --output microdados --remaining-ok

          if [ -n "$COMPETENCIA" ]; then
            arquivo=$(find microdados -type f \( \
              -iname "CAGEDMOV${COMPETENCIA}.zip" -o \
              -iname "CAGEDMOV${COMPETENCIA}.7z" -o \
              -iname "CAGEDMOV${COMPETENCIA}.txt" \
            \) | head -n 1)

            test -n "$arquivo"

            python importer/import_caged.py \
              --competencia "$COMPETENCIA" \
              --file "$arquivo" \
              --source-url "$CAGED_DRIVE_FOLDER_URL"
          else
            arquivo=$(find microdados -type f \( \
              -iname 'CAGEDMOV*.zip' -o \
              -iname 'CAGEDMOV*.7z' -o \
              -iname 'CAGEDMOV*.txt' \
            \) | sort | tail -n 1)

            test -n "$arquivo"

            competencia=$(basename "$arquivo" | sed -E 's/^CAGEDMOV([0-9]{6})\.(zip|7z|txt)$/\1/i')

            python importer/import_caged.py \
              --competencia "$competencia" \
              --file "$arquivo" \
              --source-url "$CAGED_DRIVE_FOLDER_URL"
          fi
