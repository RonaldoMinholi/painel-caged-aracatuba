name: Atualizar ou importar CAGED

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Atualização normal ou importação de período histórico.'
        type: choice
        required: true
        default: recentes
        options:
          - recentes
          - periodo
      competencia_inicial:
        description: 'Somente para "periodo": primeiro mês AAAAMM. Ex.: 202001.'
        required: false
      competencia_final:
        description: 'Somente para "periodo": último mês AAAAMM. Ex.: 202012.'
        required: false

jobs:
  import:
    concurrency:
      group: caged-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r importer/requirements.txt

      - name: Atualizar Tabela 8.1 oficial revisada
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TABLES_FOLDER_URL: https://drive.google.com/drive/folders/1SLFCZ184KseNP8W9Xc6YMe6rCrHeuaiU?usp=drive_link
          SOURCE_PAGE_URL: https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/acoes-e-programas/programas-projetos-acoes-obras-e-atividades/estatisticas-trabalho/novo-caged
        run: |
          mkdir -p official-tables
          gdown --folder "$TABLES_FOLDER_URL" --output official-tables --remaining-ok
          workbook=$(python importer/select_official_table.py --folder official-tables)
          test -n "$workbook"
          python importer/import_official_tables.py --file "$workbook" --source-url "$SOURCE_PAGE_URL"

      - name: Importar microdados da Região Administrativa de Araçatuba
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMPORT_MODE: ${{ inputs.modo }}
          COMPETENCIA_INICIAL: ${{ inputs.competencia_inicial }}
          COMPETENCIA_FINAL: ${{ inputs.competencia_final }}
          CAGED_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/12plsRjwzGWeR2Vscutdz5I0K94vjWfmA
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p microdados
          if [ "$IMPORT_MODE" = "periodo" ]; then
            test -n "$COMPETENCIA_INICIAL"
            test -n "$COMPETENCIA_FINAL"
            filtros=(--inicio "$COMPETENCIA_INICIAL" --fim "$COMPETENCIA_FINAL")
          else
            filtros=(--inicio "$(date -u -d '18 months ago' +%Y%m)")
          fi

          python importer/download_caged_mov.py \
            --folder "$CAGED_DRIVE_FOLDER_URL" \
            --output microdados \
            "${filtros[@]}"

          declare -A importados
          : > microdados/competencias-importadas.txt
          : > microdados/cagedmov-import-failures.txt

          while IFS= read -r arquivo; do
            nome=$(basename "$arquivo")
            competencia=$(printf '%s' "$nome" | sed -nE 's/^CAGEDMOV([0-9]{6})\.(zip|7z|txt)$/\1/Ip')
            [ -n "$competencia" ] || continue
            [ -z "${importados[$competencia]+x}" ] || continue
            importados[$competencia]=1

            arquivo_for=$(find microdados -type f \( -iname "CAGEDFOR${competencia}.zip" -o -iname "CAGEDFOR${competencia}.7z" -o -iname "CAGEDFOR${competencia}.txt" \) | head -n 1)
            argumentos=(--competencia "$competencia" --file "$arquivo" --source-url "$CAGED_DRIVE_FOLDER_URL")
            [ -n "$arquivo_for" ] && argumentos+=(--file "$arquivo_for")

            echo "Importando competência $competencia"
            if python importer/import_caged.py "${argumentos[@]}"; then
              echo "$competencia" >> microdados/competencias-importadas.txt
            else
              echo "$competencia | $arquivo" >> microdados/cagedmov-import-failures.txt
            fi
          done < <(
            find microdados -type f \
              \( -iname 'CAGEDMOV*.zip' -o -iname 'CAGEDMOV*.7z' -o -iname 'CAGEDMOV*.txt' \) | sort
          )

          test -s microdados/competencias-importadas.txt
          if [ -s microdados/cagedmov-download-failures.txt ] || [ -s microdados/cagedmov-import-failures.txt ]; then
            cat microdados/cagedmov-download-failures.txt 2>/dev/null || true
            cat microdados/cagedmov-import-failures.txt 2>/dev/null || true
            exit 1
          fi

      - name: Recalcular estoque setorial
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python importer/refresh_group_stock.py

      - name: Validar automaticamente contra o Power BI oficial
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          : > validation-report.md
          while IFS= read -r competencia; do
            echo "# Validação oficial Novo CAGED — $competencia" | tee -a validation-report.md
            python importer/validate_caged.py --competencia "$competencia" | tee -a validation-report.md
          done < microdados/competencias-importadas.txt
          cat validation-report.md >> "$GITHUB_STEP_SUMMARY"
