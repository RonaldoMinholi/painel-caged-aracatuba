name: Recalcular e validar CAGED já importado

on:
  workflow_dispatch:
    inputs:
      competencia_inicial:
        description: 'Primeiro mês AAAAMM. Ex.: 202004.'
        required: true
      competencia_final:
        description: 'Último mês AAAAMM. Ex.: 202112.'
        required: true

jobs:
  recalculate-and-validate:
    concurrency:
      group: caged-import
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r importer/requirements.txt

      - name: Recalcular estoque da tela Setorial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python importer/refresh_group_stock.py

      - name: Validar cada competência contra o Power BI oficial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          : > validation-report.md
          competencia="${{ inputs.competencia_inicial }}"
          fim="${{ inputs.competencia_final }}"

          while [ "$competencia" -le "$fim" ]; do
            echo "# Validação oficial Novo CAGED — $competencia" | tee -a validation-report.md
            python importer/validate_caged.py --competencia "$competencia" | tee -a validation-report.md

            ano="${competencia:0:4}"
            mes="${competencia:4:2}"
            mes=$((10#$mes + 1))
            if [ "$mes" -eq 13 ]; then
              ano=$((ano + 1))
              mes=1
            fi
            printf -v competencia '%04d%02d' "$ano" "$mes"
          done

          cat validation-report.md >> "$GITHUB_STEP_SUMMARY"
