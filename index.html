<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Informações do Novo CAGED</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <div class="report-shell">
      <header class="report-header">
        <h1>PAINEL DE INFORMAÇÕES DO NOVO CAGED</h1>

        <div class="header-arrows" aria-label="Navegação">
          <button type="button" aria-label="Página anterior">←</button>
          <button type="button" aria-label="Próxima página">→</button>
        </div>
      </header>

      <main class="report-body">
        <aside class="sidebar" aria-label="Filtros">
          <section class="slicer">
            <h2>Ano, Mês</h2>
            <button id="period-summary" class="period-summary" type="button" aria-expanded="true">
              Carregando… <span>⌃</span>
            </button>
            <div id="period-tree" class="period-tree"></div>
          </section>

          <section class="slicer">
            <h2>Região Administrativa</h2>
            <select id="territory">
              <option value="regional">Região Administrativa de Araçatuba</option>
            </select>
          </section>

          <section class="slicer compact-filter">
            <h2>UF</h2>
            <div class="readonly-filter">São Paulo</div>
          </section>

          <section class="slicer">
            <h2>Município</h2>
            <select id="municipality">
              <option value="regional">Todos</option>
            </select>
          </section>
        </aside>

        <section class="content">
          <section class="indicators" aria-label="Indicadores">
            <article>
              <h2>Admissões</h2>
              <strong id="admissions">—</strong>
            </article>

            <article>
              <h2>Desligamentos</h2>
              <strong id="dismissals">—</strong>
            </article>

            <article>
              <h2>Saldo</h2>
              <strong id="balance">—</strong>
            </article>

            <article>
              <h2>Estoque</h2>
              <strong id="stock">—</strong>
            </article>

            <button class="indicator-button" type="button">
              Seleção de<br />Indicadores
            </button>
          </section>

          <section class="chart-section line-section">
            <h2>Evolução das Admissões e Desligamentos por Competência da Movimentação</h2>
            <canvas id="trend"></canvas>
          </section>

          <section class="chart-section balance-section">
            <h2>Evolução do Saldo por Competência da Movimentação</h2>

            <div class="chart-scroll">
              <div class="wide-chart">
                <canvas id="balance-chart"></canvas>
              </div>
            </div>
          </section>

          <p id="update-status" class="source-note">Carregando dados oficiais…</p>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
